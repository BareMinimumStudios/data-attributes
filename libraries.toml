[versions]
# ♻️ standard

# 📦 ~ dependencies
cloche = "0.18.10"
kotlin = "2.2.21"
fabric-language-kotlin = "1.13.7+kotlin.2.2.21"
neoforge-language-kotlin = "5.11.0"
parchment = "2024.11.17"
fzzy = "0.7.6+1.21"

endec = "0.1.14"
endec-netty = "0.1.6"
endec-gson = "0.1.7"
mixin-extras = "0.5.3"

owo-fab = "0.13.0-alpha.15+1.21"
owo-neo = "NMCHU6DZ" # "0.12.15.5-beta.1+1.21"

# 🛟 ~ loaders
fabric-loader = "0.19.3"
neoforge-loader = "21.1.26"

# 📫 version-specific

# 📌 ~ 1.21.1
fabric-api = "0.116.15"

[plugins]
cloche = { id = "earth.terrarium.cloche", version.ref = "cloche" }

[libraries]
fabric-language-kotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabric-language-kotlin" }
neoforge-language-kotlin = { module = "thedarkcolour:kotlinforforge-neoforge", version.ref = "neoforge-language-kotlin" }

# wispforest

owo-fab = { module = "io.wispforest:owo-lib", version.ref = "owo-fab" }
owo-neo = { module = "maven.modrinth:ccKDOlHs", version.ref = "owo-neo" }

sentinel-fab = { module = "io.wispforest:owo-sentinel", version.ref = "owo-fab" }
sentinel-neo = { module = "io.wispforest:owo-sentinel", version.ref = "owo-neo" }

endec = { module = "io.wispforest:endec", version.ref = "endec" }
netty-endec = { module = "io.wispforest.endec:netty", version.ref = "endec-netty" }
gson-endec = { module = "io.wispforest.endec:gson", version.ref = "endec-gson" }

mixinextras = { module = "io.github.llamalad7:mixinextras-common", version.ref = "mixin-extras" }
fuzzy-config = { module = "me.fzzyhmstrs:fzzy_config", version.ref = "fzzy" }

