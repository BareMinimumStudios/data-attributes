name: publish
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [21]
        changelog: [CHANGELOG.md]
        minecraft_version: [1.21.1]
        modrinth: [KCGxOJsE]
        curseforge: [955929]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: gradlew chmod
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Get mod metadata
        id: meta
        run: |
          version=$(grep "version =" build.gradle.kts | cut -d'=' -f2 | cut -d'"' -f2 | tr -d '\n')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: publish (fabric)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          changelog-file: ${{ matrix.changelog }}

          modrinth-id: ${{ matrix.modrinth }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: ${{ matrix.curseforge }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.REPOSITORY_TOKEN }}
          github-tag: ${{ steps.meta.outputs.version }}
          github-commitish: ${{ steps.meta.outputs.version }}

          files: build/libs/*-fabric-(${{ matrix.minecraft_version }}).jar
          github-files: |
            build/libs/intermediates/*-fabric-*dev.jar
            build/libs/intermediates/*-fabric-*sources.jar
            build/libs/intermediates/*-fabric-*javadoc.jar
            build/libs/intermediates/*-fabric-*shadow.jar

          version: fabric-${{ steps.meta.outputs.version }}

          game-versions: ${{ matrix.minecraft_version }}

          loaders: |
            quilt
            fabric

          java: ${{ matrix.java }}

      - name: publish (neoforge)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          changelog-file: ${{ matrix.changelog }}

          modrinth-id: ${{ matrix.modrinth }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: ${{ matrix.curseforge }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.REPOSITORY_TOKEN }}
          github-tag: ${{ steps.meta.outputs.version }}
          github-commitish: ${{ steps.meta.outputs.version }}

          files: build/libs/*-neoforge-(${{ matrix.minecraft_version }}).jar
          github-files: |
            build/libs/intermediates/*-neoforge-*dev.jar
            build/libs/intermediates/*-neoforge-*sources.jar
            build/libs/intermediates/*-neoforge-*javadoc.jar
            build/libs/intermediates/*-neoforge-*shadow.jar

          version: neoforge-${{ steps.meta.outputs.version }}

          game-versions: ${{ matrix.minecraft_version }}

          loaders: |
            neoforge

          java: ${{ matrix.java }}