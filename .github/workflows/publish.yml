name: publish

on:
  workflow_dispatch:

concurrency:
  group: data-attributes-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Read mod version
        id: meta
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' build.gradle.kts)
          if [ -z "$version" ]; then
            echo "Could not read version from build.gradle.kts" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build both loaders
        run: |
          chmod +x ./gradlew
          ./gradlew build --warning-mode all

      - name: Verify release files
        shell: bash
        run: |
          find build/libs -maxdepth 1 -type f -name '*.jar' -print
          python3 - <<'PY'
          from pathlib import Path
          for loader in ('fabric', 'neoforge'):
              matches = list(Path('build/libs').glob(f'*-{loader}.jar'))
              if len(matches) != 1:
                  raise SystemExit(f'Expected one release JAR for {loader}; found {matches}')
          if not Path('CHANGELOG.md').is_file():
              raise SystemExit('CHANGELOG.md is missing')
          PY

      - name: Save release files
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          if-no-files-found: error
          path: |
            build/libs/*-fabric.jar
            build/libs/*-neoforge.jar
            CHANGELOG.md

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files

      - name: Publish GitHub release
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ needs.build.outputs.version }}
          github-commitish: ${{ github.sha }}
          name: Data Attributes ${{ needs.build.outputs.version }} — Minecraft 1.21.1
          version: ${{ needs.build.outputs.version }}
          version-type: release
          changelog-file: CHANGELOG.md
          files: |
            build/libs/*-fabric.jar
            build/libs/*-neoforge.jar

  marketplaces:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: fabric
            dependencies: |
              fabric-api(required){modrinth:fabric-api}{curseforge:fabric-api}
              fabric-language-kotlin(required){modrinth:fabric-language-kotlin}{curseforge:fabric-language-kotlin}
              fzzy_config(required){modrinth:fzzy-config}{curseforge:fzzy-config}
          - loader: neoforge
            dependencies: |
              kotlinforforge(required){modrinth:kotlin-for-forge}{curseforge:kotlin-for-forge}
              fzzy_config(required){modrinth:fzzy-config}{curseforge:fzzy-config}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files

      - name: Publish ${{ matrix.loader }} to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: KCGxOJsE
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 955929
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/*-${{ matrix.loader }}.jar
          name: ${{ needs.build.outputs.version }}+1.21.1-${{ matrix.loader }}
          version: ${{ needs.build.outputs.version }}+1.21.1-${{ matrix.loader }}
          version-type: release
          changelog-file: CHANGELOG.md
          dependencies: ${{ matrix.dependencies }}
          game-versions: 1.21.1
          loaders: ${{ matrix.loader }}
          java: 21
