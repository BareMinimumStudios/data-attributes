name: publish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --warning-mode all

      - name: Read mod version
        id: meta
        shell: bash
        run: |
          version=$(grep -E '^version = "' build.gradle.kts | head -n 1 | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "Could not read the mod version from build.gradle.kts" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish Fabric
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          changelog-file: CHANGELOG.md

          modrinth-id: KCGxOJsE
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 955929
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.REPOSITORY_TOKEN }}
          github-tag: ${{ steps.meta.outputs.version }}
          github-commitish: ${{ github.sha }}

          files: build/libs/*-fabric.jar
          github-files: build/libs/*-fabric.jar
            
          dependencies: |
            fabric-api(required){modrinth:fabric-api}{curseforge:fabric-api}
            fabric-language-kotlin(required){modrinth:fabric-language-kotlin}{curseforge:fabric-language-kotlin}
            fzzy_config(required){modrinth:fzzy-config}{curseforge:fzzy-config}
            
          version: fabric-${{ steps.meta.outputs.version }}
          game-versions: 1.21.1
          loaders: fabric
          java: 21

      - name: Publish NeoForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          changelog-file: CHANGELOG.md

          modrinth-id: KCGxOJsE
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 955929
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.REPOSITORY_TOKEN }}
          github-tag: ${{ steps.meta.outputs.version }}
          github-commitish: ${{ github.sha }}

          files: build/libs/*-neoforge.jar
          github-files: build/libs/*-neoforge.jar

          dependencies: |
            kotlinforforge(required){modrinth:kotlin-for-forge}{curseforge:kotlin-for-forge}
            fzzy_config(required){modrinth:fzzy-config}{curseforge:fzzy-config}

          version: neoforge-${{ steps.meta.outputs.version }}
          game-versions: 1.21.1
          loaders: neoforge
          java: 21
